<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>FlyingRC 说明书编辑</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vditor@3.10.9/dist/index.css" />
<style>
:root{
  --bg:#f1f5f9; --panel:#ffffff; --line:#cbd5e1; --text:#0f172a; --muted:#334155;
  --brand:#0f766e; --brand-soft:#ccfbf1; --blue:#1d4ed8; --red:#b91c1c; --ok:#15803d;
  --shadow:0 12px 32px rgba(15,23,42,.14);
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header h1{margin:0;font-size:17px}
.tag{font-size:13px;color:var(--muted)}
.app{display:grid;grid-template-columns:280px 1fr;height:calc(100vh - 54px)}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side .pad{padding:12px;display:grid;gap:8px}
.side .pad input{width:100%;padding:10px 12px;border:1px solid #64748b;border-radius:10px;font-size:13px;background:#fff;color:var(--text)}
.list{overflow:auto;flex:1;padding:0 8px 12px}
.group{font-size:12px;color:var(--muted);padding:12px 8px 6px;font-weight:700}
.item{padding:9px 10px;border-radius:10px;cursor:pointer;font-size:13px;line-height:1.35;margin:2px 0;color:var(--text)}
.item:hover{background:#e2e8f0}
.item.active{background:var(--brand-soft);color:#115e59;font-weight:600}
.item small{display:block;color:var(--muted);font-size:11px;font-weight:400}
.main{display:flex;flex-direction:column;min-height:0;background:#fff}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.path{flex:1;min-width:140px;font-size:13px;color:var(--muted);word-break:break-all}
.btn{border:0;border-radius:10px;padding:9px 14px;font-size:13px;cursor:pointer;background:#e2e8f0;color:var(--text)}
.btn.primary{background:var(--brand);color:#fff;font-weight:600}
.btn.blue{background:var(--blue);color:#fff;font-weight:600}
.btn.ghost{background:#fff;color:var(--text);border:1px solid #64748b}
.btn:disabled{opacity:.45;cursor:not-allowed}
.status{padding:8px 14px;font-size:13px;min-height:30px;color:var(--muted)}
.status.ok{color:var(--ok);font-weight:600}
.status.err{color:var(--red);font-weight:600}
.status.warn{color:#92400e;font-weight:600}
#editorHost{flex:1;min-height:0;display:flex;flex-direction:column}
#vditor{flex:1;min-height:0}
/* Vditor 字体加大、对比度加强 */
.vditor{border:0 !important;border-radius:0 !important}
.vditor-content,.vditor-ir,.vditor-sv,.vditor-wysiwyg{color:#0f172a !important;font-size:15px !important;line-height:1.75 !important}
.vditor-toolbar{background:#f8fafc !important;border-bottom:1px solid #cbd5e1 !important;padding:6px 8px !important}
.vditor-toolbar button{color:#0f172a !important}
.vditor-reset{color:#0f172a !important;font-size:15px !important}
.vditor-hint,.vditor-panel{color:#0f172a !important}
.vditor-tooltipped::after{background:#0f172a !important;color:#fff !important}
/* 提示框预览 */
.vditor-wysiwyg blockquote,.vditor-ir blockquote,.vditor-sv blockquote{
  border-left:4px solid #0f766e !important;background:#f0fdfa !important;color:#134e4a !important;padding:10px 14px !important;
}
.adm{border-radius:10px;padding:12px 14px;margin:12px 0;border:1px solid #94a3b8;background:#f8fafc;color:#0f172a}
.adm-title{font-weight:700;margin-bottom:6px}
.adm.info{border-color:#0369a1;background:#e0f2fe}
.adm.warning{border-color:#b45309;background:#fef3c7}
.adm.danger{border-color:#b91c1c;background:#fee2e2}
.adm.tip{border-color:#0f766e;background:#ccfbf1}
.adm.note{border-color:#475569;background:#f1f5f9}
.snip-card{
  border:2px dashed #0f766e;border-radius:12px;padding:14px 16px;margin:12px 0;
  background:#f0fdfa;color:#134e4a;font-size:14px;line-height:1.6;
}
.snip-card b{display:block;font-size:15px;margin-bottom:4px;color:#115e59}
.snip-card small{color:#0f766e;font-size:12px}
.snip-card .snip-open{
  display:inline-block;margin-top:8px;padding:6px 12px;background:#0f766e;color:#fff;
  border-radius:8px;font-size:12px;cursor:pointer;border:0;font-weight:600;
}
.login{max-width:520px;margin:6vh auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow)}
.login h2{margin:0 0 6px}
.login .desc{color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:8px}
.tabs{display:flex;gap:8px;margin:16px 0}
.tabs button{flex:1;padding:10px;border-radius:10px;border:1px solid #64748b;background:#fff;cursor:pointer;color:var(--text);font-size:13px}
.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
label{display:block;font-size:13px;color:var(--text);margin:12px 0 6px;font-weight:600}
input[type=text],input[type=password]{width:100%;padding:11px 12px;border:1px solid #64748b;border-radius:10px;font-size:14px;background:#fff;color:var(--text)}
.login .go{width:100%;margin-top:18px;padding:12px;font-size:15px}
.steps{background:#e2e8f0;border-radius:12px;padding:12px 14px;margin-top:16px;font-size:13px;line-height:1.7;color:var(--text)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.on{display:flex}
.card{background:#fff;border-radius:14px;padding:24px;width:min(520px,100%);max-height:90vh;overflow:auto;color:var(--text);border:1px solid #64748b;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:18px}
.row{display:flex;gap:8px;margin-top:16px}
.row .btn{flex:1;padding:11px 14px;font-size:14px}
.mod-row{display:flex;gap:10px;align-items:flex-start;margin:6px 4px;padding:10px 12px;border-radius:10px;background:#f8fafc;border:1px solid #cbd5e1;cursor:pointer;font-size:14px}
.mod-row:hover{background:#e2e8f0}
.mod-row input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--brand)}
.mod-head{font-size:13px;font-weight:700;margin:14px 4px 6px}
@media(max-width:960px){ .app{grid-template-columns:1fr;grid-template-rows:32vh 1fr} }
</style>
</head>
<body>

<div id="loginView">
  <div class="login">
    <h2>FlyingRC® 说明书编辑</h2>
    <p class="desc">富文本编辑，改完点「保存并发布」即可更新官网。</p>
    <div class="tabs">
      <button class="on" id="tabWorker" onclick="setMode('worker')">团队密码</button>
      <button id="tabToken" onclick="setMode('token')">GitHub Token</button>
    </div>
    <div id="modeWorker">
      <label>管理服务地址</label>
      <input type="text" id="workerUrl" placeholder="https://xxxx.workers.dev" />
      <label>团队密码</label>
      <input type="password" id="teamPass" placeholder="由管理员提供" />
    </div>
    <div id="modeToken" style="display:none">
      <label>仓库</label>
      <input type="text" id="repoInput" value="Vulkanowrs/flyingrc-manuals" />
      <label>GitHub Token</label>
      <input type="text" id="tokenInput" placeholder="github_pat_... 或 ghp_..." />
    </div>
    <button class="btn primary go" onclick="login()">登录</button>
    <div class="status" id="loginStatus"></div>
  </div>
</div>

<div id="appView" class="app" style="display:none">
  <aside class="side">
    <div class="pad" style="padding-bottom:4px">
      <div style="font-size:12px;color:var(--muted)" id="userMeta">已登录</div>
    </div>
    <div class="pad">
      <input type="text" id="filter" placeholder="搜索：warranty / f4wse / esc" oninput="renderList()" />
      <div style="display:flex;gap:8px">
        <button class="btn ghost" style="flex:1" onclick="loadFiles()">刷新</button>
        <button class="btn ghost" style="flex:1" onclick="openNew()">新建</button>
        <button class="btn ghost" style="flex:1" onclick="logout()">退出</button>
      </div>
    </div>
    <div class="list" id="fileList"></div>
  </aside>
  <section class="main">
    <div class="bar">
      <div class="path" id="curPath">先在左侧选择说明书文件</div>
      <button class="btn ghost" onclick="toggleMode()">切换：所见即所得 / Markdown</button>
      <button class="btn ghost" onclick="discard()">撤销改动</button>
      <button class="btn ghost" id="modBtn" onclick="openModuleConfig()" disabled>产品模块</button>
      <button class="btn blue" onclick="uploadImage()">上传图片</button>
      <button class="btn primary" id="saveBtn" onclick="save()" disabled>保存并发布</button>
    </div>
    <div class="status" id="saveStatus"></div>
    <div id="editorHost"><div id="vditor"></div></div>
  </section>
</div>

<input type="file" id="fileInput" accept="image/*" style="display:none" onchange="doUploadImage(event)" />

<div class="modal" id="modal">
  <div class="card">
    <h3>新建说明页</h3>
    <label>路径（相对 docs/，自动加 .md）</label>
    <input type="text" id="newPath" placeholder="products/new-product/index" />
    <label>页面标题</label>
    <input type="text" id="newTitle" placeholder="FlyingRC® 某产品说明书" />
    <div class="row">
      <button class="btn ghost" onclick="closeModal()">取消</button>
      <button class="btn primary" onclick="createFile()">创建并打开</button>
    </div>
  </div>
</div>

<div class="modal" id="modModal">
  <div class="card" style="width:min(640px,100%)">
    <h3 id="modTitle">产品包含哪些章节</h3>
    <p style="font-size:13px;color:var(--muted);line-height:1.6">勾选后会插入公共章节；正文仍只在「公共模块」里改一次。</p>
    <div id="modList" style="max-height:55vh;overflow:auto;border:1px solid #cbd5e1;border-radius:10px;padding:8px;background:#fff"></div>
    <div class="row">
      <button class="btn ghost" onclick="closeModModal()">取消</button>
      <button class="btn primary" onclick="applyModuleConfig()">应用（记得再保存）</button>
    </div>
  </div>
</div>

<div class="modal" id="saveModal">
  <div class="card">
    <h3>保存并发布</h3>
    <label>这次改了什么？</label>
    <input type="text" id="saveMsg" placeholder="例如：更新售后电话" />
    <div class="row">
      <button class="btn ghost" onclick="closeSaveModal()">取消</button>
      <button class="btn primary" onclick="confirmSave()">确认保存</button>
    </div>
  </div>
</div>

<div class="modal" id="linkModal">
  <div class="card" style="width:min(560px,100%)">
    <h3>插入 / 修改链接</h3>
    <p style="font-size:13px;color:var(--muted);margin:0 0 8px">三步：填显示文字 → 点目标或填网址 → 插入。</p>

    <label>① 页面上显示的文字</label>
    <input type="text" id="linkText" placeholder="例如：去淘宝购买 / 查看 H7D Pro 说明书" />

    <label>② 常用链接（点一下自动填好）</label>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px">
      <button type="button" class="btn ghost" onclick="quickLink('site')">官网首页</button>
      <button type="button" class="btn ghost" onclick="quickLink('qq')">QQ 群号</button>
      <button type="button" class="btn ghost" onclick="quickLink('taobao')">淘宝店</button>
      <button type="button" class="btn ghost" onclick="quickLink('catalog')">产品总目录</button>
      <button type="button" class="btn ghost" onclick="quickLink('support')">技术支持页</button>
    </div>

    <label>跳到站内其它产品说明书</label>
    <select id="linkProduct" style="width:100%;padding:11px 12px;border:1px solid #64748b;border-radius:10px;font-size:14px;background:#fff;color:var(--text)"></select>

    <label>③ 或直接填网址 / 路径</label>
    <input type="text" id="linkUrl" placeholder="https://... 或 products/h7d-pro/index.md" />

    <div class="row">
      <button class="btn ghost" onclick="closeLinkModal()">取消</button>
      <button class="btn primary" onclick="applyLink()">插入链接</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vditor@3.10.9/dist/index.min.js"></script>
<script>
const LS = { w:"frc_worker", p:"frc_pass", t:"frc_token", r:"frc_repo", m:"frc_mode" };
let S = {
  mode:"worker", worker:"", pass:"", token:"", repo:"Vulkanowrs/flyingrc-manuals",
  owner:"Vulkanowrs", name:"flyingrc-manuals",
  files:[], cur:null, user:"", vditor:null, vditorReady:false, editorMode:"wysiwyg"
};
function $(id){return document.getElementById(id)}
function st(el,msg,cls){el.textContent=msg||"";el.className="status"+(cls?" "+cls:"")}

function setMode(m){
  S.mode=m;
  $("tabWorker").className=m==="worker"?"on":"";
  $("tabToken").className=m==="token"?"on":"";
  $("modeWorker").style.display=m==="worker"?"":"none";
  $("modeToken").style.display=m==="token"?"":"none";
}

async function api(path, options={}){
  let headers={"Content-Type":"application/json"};
  if(S.mode==="worker"){
    headers.Authorization="Bearer "+S.pass;
    headers["User-Agent"]="Mozilla/5.0 FlyingRC-Docs";
    const res=await fetch(S.worker.replace(/\/$/,"")+path,{...options,headers});
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||res.statusText);
    return data;
  }else{
    headers.Authorization="Bearer "+S.token;
    headers.Accept="application/vnd.github+json";
    headers["X-GitHub-Api-Version"]="2022-11-28";
    const res=await fetch("https://api.github.com"+path,{...options,headers});
    const data=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.message||res.statusText);
    return data;
  }
}

function b64encode(str){
  const bytes=new TextEncoder().encode(str); let bin="";
  bytes.forEach(b=>bin+=String.fromCharCode(b)); return btoa(bin);
}
function b64decode(b64){
  const bin=atob((b64||"").replace(/\n/g,""));
  return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)));
}

async function ghFiles(){
  const ref=await api(`/repos/${S.owner}/${S.name}/git/ref/heads/main`);
  const commit=await api(`/repos/${S.owner}/${S.name}/git/commits/${ref.object.sha}`);
  const tree=await api(`/repos/${S.owner}/${S.name}/git/trees/${commit.tree.sha}?recursive=1`);
  return (tree.tree||[]).filter(t=>t.type==="blob"&&t.path.startsWith("docs/")&&t.path.endsWith(".md")).map(t=>t.path).sort();
}

async function login(){
  if(S.mode==="worker"){
    S.worker=$("workerUrl").value.trim();
    S.pass=$("teamPass").value;
    if(!S.worker||!S.pass){ st($("loginStatus"),"请填写 Worker 地址和团队密码","err"); return; }
  }else{
    S.token=$("tokenInput").value.trim();
    S.repo=$("repoInput").value.trim();
    const p=S.repo.split("/"); S.owner=p[0]; S.name=p[1];
    if(!S.token||!S.name){ st($("loginStatus"),"请填写 Token 和仓库","err"); return; }
  }
  st($("loginStatus"),"正在登录…","warn");
  try{
    if(S.mode==="token"){
      const me=await api("/user");
      S.user=me.login;
    }else S.user="team";
    localStorage.setItem(LS.m,S.mode);
    localStorage.setItem(LS.w,S.worker);
    localStorage.setItem(LS.p,S.pass);
    localStorage.setItem(LS.t,S.token);
    localStorage.setItem(LS.r,S.repo);
    $("loginView").style.display="none";
    $("appView").style.display="grid";
    headerUser();
    initVditor();
    await loadFiles();
  }catch(e){ st($("loginStatus"),"登录失败："+e.message,"err"); }
}

function headerUser(){
  $("userMeta").textContent=(S.mode==="worker"?"团队密码":"Token · "+S.user)+" · "+S.owner+"/"+S.name;
}

function logout(){
  Object.values(LS).forEach(k=>localStorage.removeItem(k));
  location.reload();
}

function initVditor(){
  if(S.vditor) return;
  S.vditor = new Vditor("vditor", {
    lang: "zh_CN",
    mode: "wysiwyg",
    height: "100%",
    cache: { enable: false },
    toolbar: [
      "emoji","headings","bold","italic","strike",
      {name:"link-easy", tipTitle:"插入链接（推荐）", tip:"插入链接", text:"链接", click(){ openLinkModal(); }},
      "|","list","ordered-list","check","quote",
      "|","line","table","code",
      "|","undo","redo",
      "|","edit-mode","fullscreen","outline","preview",
      {name:"adm-tip", tipTitle:"插入提示框", tip:"插入提示框", text:"提示框", click(){ insertAdm("tip"); }},
      {name:"adm-warn", tipTitle:"插入警告框", tip:"插入警告框", text:"警告框", click(){ insertAdm("warning"); }},
      {name:"img-easy", tipTitle:"上传图片", tip:"上传图片", text:"图片", click(){ uploadImage(); }}
    ],
    preview: {
      markdown: { mark: true },
      hljs: { style: "github" },
      transform: (html) => preprocessPreview(html)
    },
    input: () => {},
    after: () => {
      S.vditorReady = true;
      st($("saveStatus"),"编辑器已就绪，请从左侧选择文件","ok");
    }
  });
}

function insertAdm(kind){
  const titles={tip:"提示",warning:"注意",info:"说明",danger:"危险",note:"备注"};
  const md=`\n\n!!! ${kind} "${titles[kind]||kind}"\n\n    在这里写内容。\n\n`;
  if(S.vditor) S.vditor.insertValue(md);
}

// ---- 傻瓜链接 ----
const PRESETS = {
  site: { text: "FlyingRC 官网", url: "https://www.FlyingRC.cn" },
  qq: { text: "官方 QQ 群 1016199449", url: "https://qm.qq.com/" },
  taobao: { text: "FlyingRC 淘宝店", url: "https://www.taobao.com" },
  catalog: { text: "产品总目录", url: "catalog.md" },
  support: { text: "技术支持", url: "shared/support.md" }
};

function productSlugFromPath(p){
  const m = (p||"").match(/^docs\/products\/([^/]+)\/index\.md$/);
  return m ? m[1] : null;
}

function relToProduct(targetSlug){
  // from current product page
  const curSlug = S.cur && productSlugFromPath(S.cur.path);
  if(curSlug && S.cur.path.indexOf("/products/")>=0){
    return "../" + targetSlug + "/index.md";
  }
  // from shared/ or other
  return "products/" + targetSlug + "/index.md";
}

function openLinkModal(){
  if(!S.vditor){ st($("saveStatus"),"请先打开一个文件","warn"); return; }
  // prefill selected text
  let sel = "";
  try{
    const dom = S.vditor.vditor && S.vditor.vditor.element;
    const wsel = window.getSelection();
    if(wsel && wsel.toString()) sel = wsel.toString().trim();
  }catch(e){}
  $("linkText").value = sel || "";
  $("linkUrl").value = "";
  const selEl = $("linkProduct");
  selEl.innerHTML = "<option value=\"\">（不选产品，用上面的网址）</option>";
  S.files.filter(p=>/^docs\/products\/[^/]+\/index\.md$/.test(p)).forEach(p=>{
    const slug = productSlugFromPath(p);
    const opt = document.createElement("option");
    opt.value = slug;
    opt.textContent = slug + "  —  " + p.replace("docs/products/","").replace("/index.md","");
    selEl.appendChild(opt);
  });
  $("linkModal").classList.add("on");
  setTimeout(()=>{ $("linkText").focus(); }, 50);
}
function closeLinkModal(){ $("linkModal").classList.remove("on"); }

function quickLink(kind){
  const p = PRESETS[kind];
  if(!p) return;
  if(!$("linkText").value) $("linkText").value = p.text;
  $("linkUrl").value = p.url;
  $("linkProduct").value = "";
}

function applyLink(){
  const text = ($("linkText").value||"").trim() || "链接";
  let url = ($("linkUrl").value||"").trim();
  const prod = $("linkProduct").value;
  if(prod){
    url = relToProduct(prod);
  }
  if(!url){
    st($("saveStatus"),"请点常用链接、选产品，或填写网址","warn");
    return;
  }
  // strip surrounding quotes
  url = url.replace(/^["']|["']$/g,"");
  const md = "[" + text + "](" + url + ")";
  if(S.vditor) S.vditor.insertValue(md);
  closeLinkModal();
  st($("saveStatus"),"已插入链接，记得「保存并发布」","ok");
}

function editExistingLinkInSelection(){
  // future: if cursor is in a link, open modal prefilled
  openLinkModal();
}

const RAW_BASE = "https://raw.githubusercontent.com/Vulkanowrs/flyingrc-manuals/main/";

function resolveRelToAbs(src, pagePath){
  if(!src) return src;
  if(/^(https?:|data:)/.test(src)) return src;
  let path = src.replace(/^\.\//,"");
  const dir = pagePath.split("/").slice(0,-1).join("/"); // docs/products/foo
  const parts = (dir + "/" + path).split("/");
  const stack = [];
  parts.forEach(p=>{ if(p==="..") stack.pop(); else if(p!=="." && p!=="") stack.push(p); });
  return RAW_BASE + stack.join("/");
}

function resolveImagesForEdit(md, pagePath){
  if(!md) return md;
  // markdown images
  md = md.replace(/!\[([^\]]*)\]\(([^)\s]+)(\s+"[^"]*")?\)/g, (all, alt, src, title)=>{
    const abs = resolveRelToAbs(src, pagePath);
    return "![" + alt + "](" + abs + (title||"") + ")";
  });
  // html img
  md = md.replace(/<img([^>]*?)src=["']([^"']+)["']/gi, (all, pre, src)=>{
    return "<img" + pre + "src=\"" + resolveRelToAbs(src, pagePath) + "\"";
  });
  return md;
}

function absToRel(src, pagePath){
  if(!src || src.indexOf(RAW_BASE)!==0) return src;
  let rest = src.slice(RAW_BASE.length); // docs/assets/...
  const dir = pagePath.split("/").slice(0,-1).join("/");
  const from = dir.split("/"); // docs, products, foo
  const to = rest.split("/");  // docs, assets, ...
  // drop common prefix
  let i=0;
  while(i<from.length && i<to.length && from[i]===to[i]) i++;
  const up = from.length - i;
  const rel = new Array(up).fill("..").concat(to.slice(i)).join("/");
  return rel || rest;
}

function restoreImagesForSave(md, pagePath){
  if(!md) return md;
  md = md.replace(/!\[([^\]]*)\]\((https:\/\/raw\.githubusercontent\.com\/[^)\s]+)(\s+"[^"]*")?\)/g, (all, alt, src, title)=>{
    return "![" + alt + "](" + absToRel(src, pagePath) + (title||"") + ")";
  });
  md = md.replace(/<img([^>]*?)src=["'](https:\/\/raw\.githubusercontent\.com\/[^"']+)["']/gi, (all, pre, src)=>{
    return "<img" + pre + "src=\"" + absToRel(src, pagePath) + "\"";
  });
  return md;
}

// 把 --8<-- "shared/xxx.md" 显示成卡片；保存时再还原
function expandSnippets(md){
  if(!md) return md;
  return md.replace(/--8<--\s+"(shared\/[^"]+)"/g, (all, path)=>{
    const title = MODULE_TITLES[path] || path;
    return '\n\n<div class="snip-card" data-snippet="'+path+'">'
      + '<b>引用公共章节：'+title+'</b>'
      + '<div>路径：<code>'+path+'</code></div>'
      + '<small>此处在构建时自动插入该文件正文。请到左侧「公共模块」修改，所有产品同步。</small>'
      + '<br><button type="button" class="snip-open" data-open="'+path+'">打开此公共模块</button>'
      + '</div>\n\n';
  });
}

function collapseSnippets(md){
  if(!md) return md;
  // HTML cards → original snippet
  md = md.replace(/<div class="snip-card"[\s\S]*?data-snippet="([^"]+)"[\s\S]*?<\/div>/g, (all, path)=>{
    return '--8<-- "'+path+'"';
  });
  // 若 Vditor 把卡片拆成纯文本，再兜底扫一遍
  md = md.replace(/引用公共章节：[^\n]*\n[\s\S]*?(shared\/[\w./-]+\.md)[\s\S]*?(?=\n---|\n## |$)/g, (all, path)=>{
    if(all.indexOf('--8<--')>=0) return all;
    return '--8<-- "'+path+'"';
  });
  // 纯文本形式的按钮残留
  md = md.replace(/\n*打开此公共模块\n*/g, "\n");
  return md;
}

async function fetchSnippetPreview(path){
  try{
    const full = "docs/" + path;
    if(S.mode==="token"){
      const data=await api("/repos/"+S.owner+"/"+S.name+"/contents/"+full+"?ref=main");
      return b64decode(data.content||"");
    }
    const data=await api("/api/file/"+encodeURIComponent(full));
    return data.content||"";
  }catch(e){ return ""; }
}

function preprocessPreview(html){ return html; }

function mdToEditor(md){
  if(!md) return "";
  return md.replace(/^!!!\s+(\w+)\s+"([^"]*)"\s*\n((?:[ \t]+.*\n?)*)/gm, (all, kind, title, body)=>{
    const text = body.split("\n").map(l=>l.replace(/^\s{4}/,"")).join("\n").trim();
    return `<div class="adm ${kind}"><div class="adm-title">${title||kind}</div><div>${text.replace(/\n/g,"<br>")}</div></div>\n\n`;
  });
}

async function loadFiles(){
  st($("saveStatus"),"加载文件…","warn");
  try{
    if(S.mode==="token") S.files=await ghFiles();
    else {
      const data=await api("/api/files");
      S.files=data.files.filter(f=>f.path.endsWith(".md")).map(f=>f.path).sort();
    }
    renderList();
    st($("saveStatus"),"共 "+S.files.length+" 个页面。选择左侧文件开始编辑。","ok");
  }catch(e){ st($("saveStatus"),"加载失败："+e.message,"err"); }
}

function groupOf(p){
  if(p.startsWith("docs/shared/flight-controller/")) return "飞控通用";
  if(p.startsWith("docs/shared/esc/")) return "电调通用";
  if(p.startsWith("docs/shared/can/")) return "CAN 通用";
  if(p.startsWith("docs/shared/")) return "公共模块（全产品）";
  if(p.startsWith("docs/products/")) return "产品特有说明书";
  return "首页 / 目录 / 帮助";
}
const GROUP_ORDER=["公共模块（全产品）","飞控通用","电调通用","CAN 通用","产品特有说明书","首页 / 目录 / 帮助"];
const MODULE_TITLES={
  "shared/safety.md":"安全注意事项","shared/first-use-check.md":"首次使用检查","shared/soldering.md":"焊接注意事项",
  "shared/warranty.md":"售后与保修","shared/support.md":"技术支持","shared/firmware-download.md":"固件下载说明",
  "shared/faq.md":"常见问题","shared/brand-intro.md":"品牌介绍","shared/other-products.md":"其它产品目录",
  "shared/disclaimer.md":"免责声明",
  "shared/flight-controller/usb-driver.md":"USB 驱动与连接","shared/flight-controller/ardupilot-flashing.md":"ArduPilot 固件",
  "shared/flight-controller/inav-flashing.md":"INAV 固件","shared/flight-controller/betaflight-flashing.md":"Betaflight 固件",
  "shared/flight-controller/receiver-wiring.md":"接收机连接",
  "shared/esc/am32-setup.md":"AM32 调参与固件","shared/esc/motor-direction.md":"电机转向与协议",
  "shared/can/can-wiring.md":"CAN 总线接线"
};
function isProductPage(p){ return /^docs\/products\/[^/]+\/index\.md$/.test(p); }
function productName(p){ const m=p.match(/^docs\/products\/([^/]+)\/index\.md$/); return m?m[1]:""; }
function sharedModulePaths(){
  return S.files.filter(p=>p.startsWith("docs/shared/")&&p.endsWith(".md")).map(p=>p.replace(/^docs\//,"")).sort();
}
function currentIncludes(content){
  const re=/--8<--\s+"(shared\/[^"]+)"/g; const set={}; let m;
  while((m=re.exec(content))) set[m[1]]=true;
  return set;
}

function renderList(){
  const q=($("filter").value||"").toLowerCase();
  const list=$("fileList"); list.innerHTML="";
  const matched=S.files.filter(p=>!q||p.toLowerCase().includes(q));
  const by={};
  matched.forEach(p=>{ const g=groupOf(p); (by[g]=by[g]||[]).push(p); });
  GROUP_ORDER.forEach(g=>{
    const arr=by[g]; if(!arr||!arr.length) return;
    const d=document.createElement("div"); d.className="group"; d.textContent=g+"（"+arr.length+"）"; list.appendChild(d);
    arr.forEach(p=>{
      const el=document.createElement("div");
      el.className="item"+(S.cur&&S.cur.path===p?" active":"");
      const short=p.replace(/^docs\//,"");
      const title=isProductPage(p)?("📁 "+productName(p)):(p.startsWith("docs/shared/")?("📄 "+(MODULE_TITLES[short]||short)):short);
      el.innerHTML=title+"<small>"+short+"</small>";
      el.onclick=()=>openFile(p);
      list.appendChild(el);
    });
  });
}

async function openFile(path){
  if(S.cur && getEditorValue()!==S.cur.original && !confirm("有未保存修改，确定切换？")) return;
  st($("saveStatus"),"打开 "+path+" …","warn");
  try{
    let sha, content;
    if(S.mode==="token"){
      const data=await api("/repos/"+S.owner+"/"+S.name+"/contents/"+path+"?ref=main");
      sha=data.sha; content=b64decode(data.content||"");
    }else{
      const data=await api("/api/file/"+encodeURIComponent(path));
      sha=data.sha; content=data.content;
    }
    S.cur={path,sha,content,original:content};
    // 编辑器里用绝对地址显示图片，保存时再转回相对路径
    const editMd = resolveImagesForEdit(content, path);
    setEditorValue(editMd);
    $("curPath").textContent=path;
    $("saveBtn").disabled=false;
    $("modBtn").disabled=!isProductPage(path);
    renderList();
    st($("saveStatus"),"已打开，图片已按仓库路径加载。改完点「保存并发布」。","ok");
  }catch(e){ st($("saveStatus"),"打开失败："+e.message,"err"); }
}

function getEditorValue(){
  if(!S.vditor) return "";
  let raw = S.vditor.getValue() || "";
  raw = collapseSnippets(raw);
  if(S.cur && S.cur.path) return restoreImagesForSave(raw, S.cur.path);
  return raw;
}
function setEditorValue(md){
  if(!S.vditor) return;
  S.vditor.setValue(expandSnippets(md||""));
}

// 卡片上的「打开此公共模块」
document.addEventListener("click", (e)=>{
  const btn = e.target.closest && e.target.closest("[data-open]");
  if(!btn) return;
  e.preventDefault();
  const rel = btn.getAttribute("data-open");
  const path = "docs/" + rel;
  openFile(path);
});

function discard(){
  if(!S.cur) return;
  setEditorValue(S.cur.original);
  st($("saveStatus"),"已撤销未保存修改","warn");
}

function toggleMode(){
  if(!S.vditor) return;
  const next = S.editorMode==="wysiwyg" ? "ir" : "wysiwyg";
  S.editorMode = next;
  S.vditor.setMode(next);
  st($("saveStatus"), next==="wysiwyg" ? "已切换：所见即所得" : "已切换：即时渲染（更接近源码）","ok");
}

function openModuleConfig(){
  if(!S.cur||!isProductPage(S.cur.path)) return;
  const inc=currentIncludes(getEditorValue());
  const mods=sharedModulePaths();
  $("modTitle").textContent="「"+productName(S.cur.path)+"」包含哪些章节";
  const box=$("modList"); box.innerHTML="";
  const groups=[
    {title:"公共模块（全产品）", test:p=>p.split("/").length===2},
    {title:"飞控通用", test:p=>p.indexOf("flight-controller/")>=0},
    {title:"电调通用", test:p=>p.indexOf("esc/")>=0},
    {title:"CAN 通用", test:p=>p.indexOf("can/")>=0}
  ];
  const used={};
  groups.forEach(g=>{
    const items=mods.filter(p=>g.test(p)&&!used[p]);
    if(!items.length) return;
    const h=document.createElement("div"); h.className="mod-head"; h.textContent=g.title; box.appendChild(h);
    items.forEach(p=>{
      used[p]=true;
      const row=document.createElement("label"); row.className="mod-row";
      row.innerHTML="<input type='checkbox' data-mod='"+p+"' "+(inc[p]?"checked":"")+" /> <span><b>"+(MODULE_TITLES[p]||p)+"</b><br><small>"+p+"</small></span>";
      box.appendChild(row);
    });
  });
  $("modModal").classList.add("on");
}
function closeModModal(){ $("modModal").classList.remove("on"); }

function removeModule(content, modPath){
  const title=MODULE_TITLES[modPath];
  let c=content.replace(new RegExp("^--8<--\\s+\""+modPath.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\"\\n?","gm"),"");
  if(title){
    c=c.replace(new RegExp("^##\\s+"+title.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\s*\\n+","gm"),"");
    c=c.replace(/(?:^---\s*\n){2,}/gm,"---\n");
    c=c.replace(/\n{3,}/g,"\n\n");
  }
  return c;
}

function applyModuleConfig(){
  if(!S.cur||!isProductPage(S.cur.path)) return;
  const boxes=$("modList").querySelectorAll("input[type=checkbox][data-mod]");
  const want={}; boxes.forEach(b=>{ if(b.checked) want[b.dataset.mod]=true; });
  let content=getEditorValue();
  const had=currentIncludes(content);
  Object.keys(had).forEach(p=>{ if(!want[p]) content=removeModule(content,p); });
  const toAdd=Object.keys(want).filter(p=>!had[p]);
  if(toAdd.length){
    const block=toAdd.map(p=>"## "+(MODULE_TITLES[p]||p)+"\n\n--8<-- \""+p+"\"\n").join("\n---\n\n");
    const insert="\n---\n\n"+block+"\n---\n\n";
    if(/## 免责声明/.test(content)) content=content.replace(/## 免责声明/, insert+"## 免责声明");
    else if(/## FlyingRC® 其它产品/.test(content)) content=content.replace(/## FlyingRC® 其它产品/, insert+"## FlyingRC® 其它产品");
    else content=content.replace(/\s*$/, "\n\n"+insert);
  }
  setEditorValue(content);
  closeModModal();
  st($("saveStatus"),"章节已更新（"+Object.keys(want).length+" 个模块）。请点「保存并发布」。","ok");
}

function uploadImage(){ $("fileInput").click(); }
async function doUploadImage(ev){
  const f=ev.target.files[0]; if(!f||!S.cur) return;
  const folder=isProductPage(S.cur.path)?("docs/assets/"+productName(S.cur.path)):"docs/assets/uploads";
  const path=folder+"/"+f.name.replace(/\s+/g,"-");
  st($("saveStatus"),"上传图片中…","warn");
  try{
    const buf=await f.arrayBuffer();
    const b64=btoa(Array.from(new Uint8Array(buf)).map(b=>String.fromCharCode(b)).join(""));
    if(S.mode==="token"){
      let sha;
      try{ const ex=await api("/repos/"+S.owner+"/"+S.name+"/contents/"+path+"?ref=main"); sha=ex.sha; }catch(_){}
      await api("/repos/"+S.owner+"/"+S.name+"/contents/"+path,{
        method:"PUT", body:JSON.stringify({message:"assets: "+path,content:b64,sha,branch:"main"})
      });
    }else{
      await api("/api/upload",{method:"POST",body:JSON.stringify({path,contentBase64:b64,message:"assets: "+path})});
    }
    const abs = RAW_BASE + path;
    if(S.vditor) S.vditor.insertValue("!["+f.name+"]("+abs+")");
    st($("saveStatus"),"图片已上传并插入。保存说明书后，会写成相对路径，官网可正常显示。","ok");
  }catch(e){ st($("saveStatus"),"上传失败："+e.message,"err"); }
  ev.target.value="";
}

function save(){
  if(!S.cur) return;
  const content=getEditorValue();
  if(content===S.cur.original){ st($("saveStatus"),"内容没有变化","warn"); return; }
  $("saveMsg").value="docs: 更新 "+S.cur.path.replace("docs/","");
  $("saveModal").classList.add("on");
  setTimeout(()=>{ $("saveMsg").focus(); $("saveMsg").select(); },50);
}
function closeSaveModal(){ $("saveModal").classList.remove("on"); }
async function confirmSave(){
  const msg=($("saveMsg").value||"").trim()||"docs: 更新说明书内容";
  closeSaveModal();
  const content=getEditorValue();
  $("saveBtn").disabled=true; st($("saveStatus"),"正在保存…","warn");
  try{
    if(S.mode==="token"){
      await api("/repos/"+S.owner+"/"+S.name+"/contents/"+S.cur.path,{
        method:"PUT", body:JSON.stringify({message:msg,content:b64encode(content),sha:S.cur.sha,branch:"main"})
      });
      const data=await api("/repos/"+S.owner+"/"+S.name+"/contents/"+S.cur.path+"?ref=main");
      S.cur={path:S.cur.path,sha:data.sha,content,original:content};
    }else{
      await api("/api/file/"+encodeURIComponent(S.cur.path),{
        method:"PUT", body:JSON.stringify({message:msg,content,sha:S.cur.sha})
      });
      const data=await api("/api/file/"+encodeURIComponent(S.cur.path));
      S.cur={path:S.cur.path,sha:data.sha,content,original:content};
    }
    $("saveBtn").disabled=false;
    st($("saveStatus"),"已保存。约 1–2 分钟后官网更新。","ok");
  }catch(e){
    $("saveBtn").disabled=false;
    st($("saveStatus"),"保存失败："+e.message,"err");
  }
}

function openNew(){ $("modal").classList.add("on"); }
function closeModal(){ $("modal").classList.remove("on"); }
async function createFile(){
  let p=$("newPath").value.trim().replace(/^docs\//,"");
  const title=$("newTitle").value.trim()||"新页面";
  if(!p.endsWith(".md")) p=p+".md";
  if(!p.startsWith("products/")&&!p.startsWith("shared/")) p="products/"+p;
  const path="docs/"+p;
  const content="# "+title+"\n\n开始写正文。\n";
  closeModal();
  try{
    if(S.mode==="token"){
      await api("/repos/"+S.owner+"/"+S.name+"/contents/"+path,{
        method:"PUT", body:JSON.stringify({message:"docs: create "+path,content:b64encode(content),branch:"main"})
      });
    }else{
      await api("/api/file/"+encodeURIComponent(path),{method:"PUT",body:JSON.stringify({message:"docs: create "+path,content})});
    }
    await loadFiles();
    await openFile(path);
    st($("saveStatus"),"已新建。记得在目录/导航中加入链接。","ok");
  }catch(e){ st($("saveStatus"),"新建失败："+e.message,"err"); }
}

$("saveMsg") && $("saveMsg").addEventListener("keydown", e=>{ if(e.key==="Enter") confirmSave(); });
$("linkUrl") && $("linkUrl").addEventListener("keydown", e=>{ if(e.key==="Enter") applyLink(); });
$("linkText") && $("linkText").addEventListener("keydown", e=>{ if(e.key==="Enter") $("linkUrl").focus(); });
$("linkProduct") && $("linkProduct").addEventListener("change", e=>{
  if(e.target.value){
    const slug = e.target.value;
    if(!$("linkText").value) $("linkText").value = "查看 " + slug + " 说明书";
    $("linkUrl").value = "";
  }
});
$("teamPass") && $("teamPass").addEventListener("keydown", e=>{ if(e.key==="Enter") login(); });
$("tokenInput") && $("tokenInput").addEventListener("keydown", e=>{ if(e.key==="Enter") login(); });

(function boot(){
  const m=localStorage.getItem(LS.m)||"worker";
  setMode(m);
  $("workerUrl").value=localStorage.getItem(LS.w)||"";
  $("teamPass").value=localStorage.getItem(LS.p)||"";
  $("tokenInput").value=localStorage.getItem(LS.t)||"";
  $("repoInput").value=localStorage.getItem(LS.r)||"Vulkanowrs/flyingrc-manuals";
  if((m==="worker"&&$("workerUrl").value&&$("teamPass").value)||(m==="token"&&$("tokenInput").value)) login();
})();
</script>
