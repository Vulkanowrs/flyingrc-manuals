# FlyingRC 产品参数数据库
# 说明书参数表、官网产品列表、下载页可共用本文件
# 必填字段：name, category, status, short_code
# 公共内容口径源：docs 公共章节以 F4WSE PRO 手册 2026-08-15 版为准

f4wse-pro:
  name: FlyingRC® F4WSE PRO
  name_en: FlyingRC F4WSE PRO
  category: flight-controller
  series: fixed-wing
  revision: Pro
  status: active
  short_code: f4wse
  manual_url: /manual/f4wse-pro/
  firmware_url: /downloads/f4wse-pro/
  price_cny: 140
  manual_updated: "2026-08-15"
  is_content_source_of_truth: true
  mcu: STM32F405RGT6
  mcu_mhz: 168
  flash_kb: 1024
  ram_kb: 192
  imu:
    - ICM-42688-P
    - BMI270
  barometer:
    - SPA06-001
  magnetometer: none
  osd_analog: AT7465E
  size_mm: "22.86 x 43.18 x 9"
  weight_g: 9.1
  uart_count: 6
  pwm_count: 12
  i2c_count: 1
  current_adc: "80A cont / 120A burst"
  bec_device: "5V3A"
  bec_servo: "5V5A"
  power_input_v: "7-28V (2-6S LiPo)"
  usb: "Type-C external board"
  blackbox: "External TF, max usable 4GB (up to 32GB card)"
  sbus_inverted: true
  firmware:
    - ArduPilot
    - INAV
    - Betaflight
  firmware_target: MatekF405-TE
  firmware_inav_target: MatekF405TE_SD
  assets:
    hero: assets/f4wse-pro/product-hero.jpg
    layout_front: assets/f4wse-pro/layout-front.jpg
    layout_back: assets/f4wse-pro/layout-back.jpg

f4wing-mini:
